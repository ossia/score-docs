# One-line descriptions for the scores that have no documentation page yet, to
# fill the Description field their start-screen card shows.
#
# Each is condensed from the score itself: the text boxes its author wrote
# where there are any, its processes otherwise. Applied with
#   ruby script/examples/metadata.rb describe
# which never overwrites a description already in a document.
#
# A score that gains a documentation page does not need an entry here: `prepare`
# takes the description from the page's front matter instead.

common-practices/3d/generative-3d: >-
  Animate a procedural 3D form by combining deformation, colour and repeating
  motion. Explore how a few control signals can give a shape its character.

common-practices/led-design/led-combination: >-
  Compose an LED display from several moving colour patterns and preview how
  they fit together before sending them to physical lights.

common-practices/led-design/led-with-arrays: >-
  Build an LED colour pattern from separate red, green and blue sequences,
  exploring how numerical values become light without writing a shader.

common-practices/sound-spatialization/spat-example-dbap: >-
  Move sounds through a speaker layout with distance-based amplitude panning.
  Follow the source paths and see how their movement changes each speaker's gain.

examples/3d/example-big-cube: >-
  Fill a volume with a cloud of points generated on the GPU. Edit the position
  calculation to explore the relationship between a rule and a spatial form.

examples/advanced/cpu-data-bending: >-
  Break up a live camera image with CPU-based data moshing and degradation.
  Explore Bendage's glitch effects at a reduced image resolution.

examples/advanced/gpu-data-bending: >-
  Transform a live camera image with destructive GPU shader effects, using
  distortion and image breakup as material for live visuals.

examples/advanced/pipeline-switching: >-
  Give a visual performance a rhythmic structure by switching between two
  video treatments on musical beats and bars.

examples/ai/pose-detection: >-
  Extract faces and facial landmarks from a camera image as a starting point
  for face-responsive interaction. Inspect and filter the tracking data
  before using it to control sound or images.

examples/ai/tracking-to-midi: >-
  Play notes by moving through virtual zones. Tracked positions entering and
  leaving regions become MIDI events for a movement-controlled instrument.

examples/audio/looper: >-
  Build a live musical layer by recording and replaying audio over a drum
  machine part. Explore looping as a performance tool rather than a fixed clip.

examples/basics/cues: >-
  Recall parameter settings with independent cues, so changes can follow a
  performer or an operator rather than a fixed timeline.

examples/basics/timemodel-patterns: >-
  Explore ways to structure a performance with temporal patterns, combining
  predetermined timing with events that can wait for live interaction.

examples/devices/http-llm: >-
  Bring generated text into a score by sending a prompt to an
  OpenAI-compatible language-model service over HTTP.

examples/devices/midi-mapping: >-
  Perform visual effects from a MIDI controller. Learn your own knobs and
  sliders, then map their gestures to changes in the image.

examples/devices/midi-to-synths: >-
  Play a lead voice and drums from an external MIDI device, using separate
  channels to turn score into a playable synthesizer.

examples/devices/osc: >-
  Animate a 3D scene from incoming OSC messages, linking another application
  or controller to the visual performance.

examples/devices/samplers: >-
  Build sampled melodies and rhythms with soundfonts and drum kits, combining
  sequenced notes with an arpeggiator.

examples/devices/sensors2osc: >-
  Use a phone as a motion controller: send its orientation over OSC with
  Sensors2OSC and map the movement to a 3D scene.

examples/devices/slack: >-
  Send a Slack notification from a score through Bitfocus Companion,
  connecting a performance cue to a message outside the media patch.

examples/devices/synths: >-
  Shape synthesized lead and drum sounds with modulation, saturation and
  filtering, exploring how effects change the character of an instrument.

examples/video/ffmpeg-streaming: >-
  Send and receive video over a network with FFMPEG, connecting a visual
  patch to another machine through UDP streaming.

examples/video/video-mapping-multi-projector: >-
  Extend one image across several projectors and blend their overlaps,
  composing a larger projection surface from multiple outputs.

examples/video/video-mapping-rect: >-
  Arrange several images within one output, using rectangular mapping to
  build a projection layout or a split-screen composition.

reference/processes/array-tool: >-
  Reshape a sequence of values and watch the resulting LED pattern change,
  exploring how array operations can rearrange a lighting design.

reference/processes/arraygen: >-
  Generate and plot a sequence of values to explore the shapes that can
  drive light patterns, control curves or other data-based media.

reference/processes/audio-channel-extractor: >-
  Isolate individual channels from a multichannel recording, so each part
  can be routed or processed independently.

reference/processes/audio-merger: >-
  Combine separate audio sources into a multichannel stream while keeping
  them on distinct channels for later routing or spatial processing.

reference/processes/combine-spread: >-
  Group separate controls into one value array, then split them apart again
  to explore how a patch can handle several related parameters together.

reference/processes/geometry-filter: >-
  Deform a sphere before rendering it, exploring how a geometry filter
  changes the silhouette and surface of a familiar shape.

reference/processes/hdf5: >-
  Read numerical data and textures from an HDF5 dataset as source material
  for data-driven visuals.

reference/processes/led-view: >-
  Preview a generated colour sequence as an LED strip, checking a lighting
  pattern on screen before working with physical lights.

reference/processes/mapping-tool: >-
  Shape the response of a control signal with a learned range and a curve,
  turning raw input into a more expressive gesture.

reference/processes/point-cloud: >-
  Reveal a model's shape through points rather than a solid surface, using
  rotation and image trails to explore its structure.
